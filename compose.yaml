name: qhse-platform

x-app-environment: &app-environment
  NODE_ENV: development
  DATABASE_URL: postgresql://qhse_app:change-me@postgres:5432/qhse
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: qhse-files
  S3_ACCESS_KEY: local-access-key
  S3_SECRET_KEY: local-secret-key
  S3_FORCE_PATH_STYLE: "true"
  DOCLING_URL: http://docling:8000
  NORMATIVE_RAG_ENABLED: ${NORMATIVE_RAG_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_PROFILE_MODEL: ${OPENAI_PROFILE_MODEL:-gpt-5-mini}
  OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
  LOG_LEVEL: info

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: qhse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-app-roles.sql:ro
      - ./infrastructure/docker/postgres/init-shadow.sql:/docker-entrypoint-initdb.d/20-shadow-database.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qhse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.1
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-secret-key
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 local-access-key local-secret-key &&
        mc mb --ignore-existing local/qhse-files &&
        mc anonymous set none local/qhse-files
    networks: [data]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [app]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  docling:
    build:
      context: ./services/docling
    environment:
      DOCLING_MAX_UPLOAD_BYTES: "20971520"
    ports:
      - "8000:8000"
    networks: [app]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      <<: *app-environment
      API_PORT: "3000"
      API_HOST: 0.0.0.0
      APP_ORIGIN: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      BETTER_AUTH_SECRET: local-only-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      MAX_UPLOAD_BYTES: "10485760"
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      docling: { condition: service_healthy }
    networks: [app, data]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      <<: *app-environment
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      docling: { condition: service_healthy }
    networks: [app, data]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_DEFAULT_LOCALE: fr
    ports:
      - "5173:80"
    depends_on:
      api: { condition: service_started }
    networks: [app]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  app:
  data:
