name: qhse-platform

x-app-environment: &app-environment
  NODE_ENV: development
  DATABASE_URL: postgresql://qhse_app:change-me@postgres:5432/qhse
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: qhse-files
  S3_ACCESS_KEY: local-access-key
  S3_SECRET_KEY: local-secret-key
  S3_FORCE_PATH_STYLE: "true"
  DOCLING_URL: http://docling:8000
  APP_ORIGIN: http://localhost:5173
  BETTER_AUTH_SECRET: local-only-secret-at-least-32-characters-long
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  BREVO_API_BASE_URL: ${BREVO_API_BASE_URL:-https://api.brevo.com/v3}
  NORMATIVE_RAG_ENABLED: ${NORMATIVE_RAG_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
  LLM_PROFILE_PROVIDER: ${LLM_PROFILE_PROVIDER:-openai}
  LLM_PROFILE_MODEL: ${LLM_PROFILE_MODEL:-gpt-5-mini}
  LLM_EMBEDDING_PROVIDER: ${LLM_EMBEDDING_PROVIDER:-openai}
  LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
  LLM_REGULATORY_PROVIDER: ${LLM_REGULATORY_PROVIDER:-openai}
  LLM_REGULATORY_MODEL: ${LLM_REGULATORY_MODEL:-gpt-5-mini}
  LLM_REGULATORY_VERIFICATION_PROVIDER: ${LLM_REGULATORY_VERIFICATION_PROVIDER:-openai}
  LLM_REGULATORY_VERIFICATION_MODEL: ${LLM_REGULATORY_VERIFICATION_MODEL:-gpt-5-nano}
  LLM_CUSTOM_MODELS_JSON: ${LLM_CUSTOM_MODELS_JSON:-[]}
  ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-low}
  ANTHROPIC_SPEED: ${ANTHROPIC_SPEED:-standard}
  GOOGLE_THINKING_LEVEL: ${GOOGLE_THINKING_LEVEL:-low}
  GOOGLE_THINKING_BUDGET: ${GOOGLE_THINKING_BUDGET:-}
  OPENAI_PROFILE_MODEL: ${OPENAI_PROFILE_MODEL:-gpt-5-mini}
  OPENAI_REGULATORY_MODEL: ${OPENAI_REGULATORY_MODEL:-gpt-5-mini}
  OPENAI_REGULATORY_REASONING_EFFORT: ${OPENAI_REGULATORY_REASONING_EFFORT:-low}
  OPENAI_REGULATORY_TIMEOUT_MS: ${OPENAI_REGULATORY_TIMEOUT_MS:-180000}
  OPENAI_REGULATORY_DRAFT_MAX_OUTPUT_TOKENS: ${OPENAI_REGULATORY_DRAFT_MAX_OUTPUT_TOKENS:-12000}
  OPENAI_REGULATORY_VERIFICATION_MAX_OUTPUT_TOKENS: ${OPENAI_REGULATORY_VERIFICATION_MAX_OUTPUT_TOKENS:-6000}
  OPENAI_REGULATORY_RUN_BUDGET_USD: ${OPENAI_REGULATORY_RUN_BUDGET_USD:-1}
  OPENAI_REGULATORY_INPUT_USD_PER_MTOK: ${OPENAI_REGULATORY_INPUT_USD_PER_MTOK:-0.25}
  OPENAI_REGULATORY_OUTPUT_USD_PER_MTOK: ${OPENAI_REGULATORY_OUTPUT_USD_PER_MTOK:-2}
  OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  LOG_OTLP: "true"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: qhse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-app-roles.sql:ro
      - ./infrastructure/docker/postgres/init-shadow.sql:/docker-entrypoint-initdb.d/20-shadow-database.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qhse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.1
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-secret-key
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 local-access-key local-secret-key &&
        mc mb --ignore-existing local/qhse-files &&
        mc anonymous set none local/qhse-files
    networks: [data]
    restart: "no"

  # --- Observability -------------------------------------------------------
  # Local-only stack. Production runs Grafana/Loki/Tempo separately; apps there
  # just point OTEL_EXPORTER_OTLP_ENDPOINT at the managed collector.
  loki:
    image: grafana/loki:3.5.7
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./infrastructure/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [observability]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s

  tempo:
    image: grafana/tempo:2.9.0
    command: -config.file=/etc/tempo/tempo.yaml
    user: root
    volumes:
      - ./infrastructure/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks: [observability]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s

  alloy:
    image: grafana/alloy:v1.11.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only socket access so Alloy can discover and tail container logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      # OTLP intake. Published on the host because `pnpm dev` runs the Node
      # apps outside Docker -- they export to localhost:4318.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    depends_on:
      loki: { condition: service_healthy }
      tempo: { condition: service_healthy }
    networks: [app, data, observability]

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceQLStreaming
      GF_LOG_LEVEL: warn
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      loki: { condition: service_healthy }
      tempo: { condition: service_healthy }
    networks: [observability]

  docling:
    build:
      context: ./services/docling
    environment:
      DOCLING_MAX_UPLOAD_BYTES: "20971520"
      # Tesseract language packs, as installed in the image. Docling's automatic engine
      # selection defaults to European languages only, which left Arabic sources being
      # recognized as French.
      DOCLING_OCR_LANGUAGES: "fra+ara"
      # The converter holds model state that is not safe to drive from several threads at once.
      DOCLING_MAX_CONCURRENT_CONVERSIONS: "1"
    ports:
      - "8000:8000"
    networks: [app]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      <<: *app-environment
      API_PORT: "3000"
      API_HOST: 0.0.0.0
      APP_ORIGIN: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      BETTER_AUTH_SECRET: local-only-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      MAX_UPLOAD_BYTES: "10485760"
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      docling: { condition: service_healthy }
    networks: [app, data]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      <<: *app-environment
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: "4002"
    ports:
      - "127.0.0.1:4002:4002"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4002/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      docling: { condition: service_healthy }
    networks: [app, data]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_DEFAULT_LOCALE: fr
    ports:
      - "5173:80"
    depends_on:
      api: { condition: service_started }
    networks: [app]

volumes:
  loki-data:
  tempo-data:
  grafana-data:
  alloy-data:
  postgres-data:
  redis-data:
  minio-data:

networks:
  app:
  data:
  observability:
