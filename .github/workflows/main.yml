name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  complete-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:api
      - run: pnpm test:security
      - run: pnpm test:contracts
      - run: pnpm test:integration
        env:
          TESTCONTAINERS_ENABLED: "true"
      - run: pnpm build
      - run: docker compose build api worker web docling
