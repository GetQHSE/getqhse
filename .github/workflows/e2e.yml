name: Extended tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the test stack
        run: |
          cp .env.example .env
          mkdir -p artifacts
          docker compose up -d postgres redis minio minio-init mailpit
          pnpm exec dotenv -e .env -- pnpm db:deploy
          pnpm exec dotenv -e .env -- pnpm db:seed
          nohup pnpm dev:apps > artifacts/apps.log 2>&1 &
          for url in \
            http://localhost:3000/health/ready \
            http://localhost:3001/health/ready \
            http://localhost:5173 \
            http://localhost:5174; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" >/dev/null; then break; fi
              if [ "$attempt" -eq 60 ]; then echo "Timed out waiting for $url"; exit 1; fi
              sleep 2
            done
          done
      - run: pnpm test:e2e
        env:
          E2E_ADMIN_USER_EMAIL: admin@example.invalid
          E2E_ADMIN_USER_PASSWORD: change-this-local-admin-password
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > artifacts/compose.log
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the test stack
        if: always()
        run: docker compose down --volumes

  docling:
    name: Docling integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Docling
        run: |
          mkdir -p artifacts
          docker compose up -d --build docling
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://localhost:8000/health/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 90 ]; then echo "Timed out waiting for Docling"; exit 1; fi
            sleep 5
          done
      - run: pnpm test:docling
        env:
          DOCLING_INTEGRATION_URL: http://localhost:8000
      - name: Collect Docling logs
        if: failure()
        run: docker compose logs --no-color docling > artifacts/docling.log
      - name: Upload Docling artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: docling-results
          path: artifacts/
          retention-days: 14
      - name: Stop Docling
        if: always()
        run: docker compose down --volumes
