name: qhse-platform-test

services:
  postgres-test:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_DB: qhse_test
      POSTGRES_USER: qhse_test
      POSTGRES_PASSWORD: qhse_test
    ports:
      - "55432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qhse_test -d qhse_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:8.8.1
    ports:
      - "56379:6379"
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-test:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-test-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-test-data:
  redis-test-data:
  minio-test-data:
